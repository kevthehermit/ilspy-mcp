[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilspy-mcp"
version = "0.1.0"
description = "MCP server exposing ILSpy .NET decompilation as tools over HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ilspy-mcp" }]
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
ilspy-mcp = "ilspy_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ilspy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
